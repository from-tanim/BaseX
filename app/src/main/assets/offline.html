<!DOCTYPE html>
<html>
<head>
    <title>Oops! You're Offline</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background: #ffeb3b;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #ff5722; }
        .dino {
            font-size: 100px;
            margin: 20px;
        }
        .message {
            font-size: 18px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="dino">🦖</div>
    <h1>Whoops! No Internet!</h1>
    <div class="message">
        <p>Looks like a T-Rex ate your connection!</p>
        <p>Check your Wi-Fi or try again later.</p>
    </div>
    <button onclick="window.location.reload()">🔄 Try Again</button>
</body>
</html>
